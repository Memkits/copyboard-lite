[package]
name = "copyboard-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A lightweight HTTP copyboard backed by UnionID"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
unionid = { git = "https://github.com/worktools/unionid.git", rev = "3f0ed5bd4e726b02d3875adee237cce4f03f54b7" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
