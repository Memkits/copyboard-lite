[package]
name = "copyboard-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A lightweight HTTP copyboard backed by UnionID"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
unionid = { git = "https://github.com/worktools/unionid.git", rev = "b46a22fd2ff1d9797848d23b9ee6b4d5bcf610a8" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
