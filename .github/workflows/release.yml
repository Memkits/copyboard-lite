name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64 binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Build release binary
        run: cargo build --locked --release --bin copyboard-lite
      - name: Package binary
        run: |
          mkdir -p release
          strip target/release/copyboard-lite
          tar -C target/release -czf release/copyboard-lite-linux-x86_64.tar.gz copyboard-lite
          sha256sum release/copyboard-lite-linux-x86_64.tar.gz > release/copyboard-lite-linux-x86_64.tar.gz.sha256
          file target/release/copyboard-lite
          ldd target/release/copyboard-lite
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --title "Copyboard Lite ${GITHUB_REF_NAME}"
