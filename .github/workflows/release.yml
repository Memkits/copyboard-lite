name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64 binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Build release binary
        run: cargo build --locked --release --bin copyboard-lite
      - name: Package binary
        run: |
          mkdir -p release
          strip target/release/copyboard-lite
          tar -C target/release -czf release/copyboard-lite-linux-x86_64.tar.gz copyboard-lite
          sha256sum release/copyboard-lite-linux-x86_64.tar.gz > release/copyboard-lite-linux-x86_64.tar.gz.sha256
          file target/release/copyboard-lite
          ldd target/release/copyboard-lite
      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key_tc }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/copyboard-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/copyboard-ssh/key"
          chmod 600 "$RUNNER_TEMP/copyboard-ssh/key"
      - name: Upload binary to deployment server
        run: |
          ssh -i "$RUNNER_TEMP/copyboard-ssh/key" \
            -o StrictHostKeyChecking=accept-new \
            rsync-user@chenyong.life \
            'mkdir -p /servers/copyboard-lite'
          rsync -avz --progress \
            -e "ssh -i $RUNNER_TEMP/copyboard-ssh/key -o StrictHostKeyChecking=accept-new" \
            release/ \
            rsync-user@chenyong.life:/servers/copyboard-lite/
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--generate-notes --title "Copyboard Lite ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release/* "${release_args[@]}"
