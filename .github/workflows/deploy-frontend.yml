name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-frontend.yml"
      - ".yarnrc.yml"
      - "assets/**"
      - "calcit-src/**"
      - "calcit.cirru"
      - "client.mjs"
      - "deps.cirru"
      - "index.html"
      - "package.json"
      - "vite.config.mjs"
      - "yarn.lock"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-frontend.yml"
      - ".yarnrc.yml"
      - "assets/**"
      - "calcit-src/**"
      - "calcit.cirru"
      - "client.mjs"
      - "deps.cirru"
      - "index.html"
      - "package.json"
      - "vite.config.mjs"
      - "yarn.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Build and upload frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Build frontend
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          yarn check
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          fi
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
          yarn build
      - name: Upload static assets to COS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
      - name: Configure deploy key
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key_tc }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/copyboard-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/copyboard-ssh/key"
          chmod 600 "$RUNNER_TEMP/copyboard-ssh/key"
      - name: Upload frontend
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          ssh -i "$RUNNER_TEMP/copyboard-ssh/key" \
            -o StrictHostKeyChecking=accept-new \
            rsync-user@chenyong.life \
            'mkdir -p /web-assets/repo/Memkits/copyboard-lite'
          rsync -avz --delete --progress \
            -e "ssh -i $RUNNER_TEMP/copyboard-ssh/key -o StrictHostKeyChecking=accept-new" \
            dist/ \
            rsync-user@chenyong.life:/web-assets/repo/Memkits/copyboard-lite/
