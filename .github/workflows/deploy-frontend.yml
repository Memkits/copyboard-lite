name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-frontend.yml"
      - ".yarnrc.yml"
      - "assets/**"
      - "calcit-src/**"
      - "calcit.cirru"
      - "client.mjs"
      - "deps.cirru"
      - "index.html"
      - "package.json"
      - "scripts/verify-cdn-build.mjs"
      - "yarn.lock"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-frontend.yml"
      - ".yarnrc.yml"
      - "assets/**"
      - "calcit-src/**"
      - "calcit.cirru"
      - "client.mjs"
      - "deps.cirru"
      - "index.html"
      - "package.json"
      - "scripts/verify-cdn-build.mjs"
      - "yarn.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Build frontend
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
        run: |
          caps --ci
          yarn install --immutable
          caps verify --toolchain
          test "$(calcit --version)" = "0.27.0"
          yarn check
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
          fi
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          yarn compile
          yarn vite build --base="$VITE_BASE_URL"
      - name: Verify CDN asset references
        run: node scripts/verify-cdn-build.mjs
      - name: Upload static assets to COS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@0ce57b26b03dbdd27a4a544a06d453415932c62d # v1.0.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
      - name: Verify uploaded CDN assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/verify-cdn-build.mjs --remote
      - name: Configure deploy key
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key_tc }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/copyboard-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/copyboard-ssh/key"
          chmod 600 "$RUNNER_TEMP/copyboard-ssh/key"
      - name: Upload frontend
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          ssh -i "$RUNNER_TEMP/copyboard-ssh/key" \
            -o StrictHostKeyChecking=accept-new \
            rsync-user@chenyong.life \
            'mkdir -p /web-assets/repo/Memkits/copyboard-lite'
          rsync -avz --delete --progress \
            -e "ssh -i $RUNNER_TEMP/copyboard-ssh/key -o StrictHostKeyChecking=accept-new" \
            dist/ \
            rsync-user@chenyong.life:/web-assets/repo/Memkits/copyboard-lite/
