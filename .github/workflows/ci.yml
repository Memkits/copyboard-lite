name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Check backend
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Check and build frontend
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit edit format
          git diff --quiet --exit-code -- calcit.cirru
          test ! -e compact.cirru
          test ! -e package.cirru
          yarn check
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          yarn build
