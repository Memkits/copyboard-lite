name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Check backend
        run: |
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
      - name: Check and build frontend
        run: |
          caps --ci
          yarn install --immutable
          caps verify --toolchain
          test "$(calcit --version)" = "0.15.1"
          calcit edit format
          git diff --exit-code -- calcit.cirru
          yarn check
          yarn compile
          yarn build
