<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8fa" />
    <title>Copyboard Lite</title>
    <link href="https://cdn.tiye.me/logo/copyboard.png" rel="icon" type="image/png" />
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body>
    <main id="app">
      <section class="shell">
        <header>
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
            <div>
              <p class="eyebrow">YOUR SPACE TO SAVE</p>
              <h1>Copyboard <span>Lite</span></h1>
            </div>
          </div>
          <span id="status" class="status">连接中</span>
        </header>
        <section id="login-panel" class="login-panel">
          <span class="section-kicker">PRIVATE CLIPBOARD</span>
          <h2>随手保存，<br />随时取用。</h2>
          <p>登录后即可访问你的私人剪贴板。内容只对你可见。</p>
          <form id="login-form">
            <label for="username">用户名</label>
            <input id="username" autocomplete="username" placeholder="输入用户名" required />
            <label for="password">密码</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="输入密码" required />
            <button type="submit">登录</button>
          </form>
        </section>
        <section id="board" hidden>
          <div class="user-bar">
            <span>你好，<strong id="current-user"></strong><span class="welcome-dot">.</span></span>
            <button id="logout" class="ghost" type="button">退出</button>
          </div>
          <form id="snippet-form">
            <label for="content">添加到剪贴板</label>
            <textarea id="content" rows="4" placeholder="在这里粘贴文字或链接…" required></textarea>
            <div class="composer-actions">
              <span>Ctrl / ⌘ + Enter 快速发送</span>
              <button type="submit">保存内容 <span aria-hidden="true">↗</span></button>
            </div>
          </form>
          <div class="section-title">
            <div><span class="section-kicker">YOUR COLLECTION</span><h2>最近内容</h2></div>
            <button id="refresh" class="ghost" type="button" aria-label="重新加载剪贴板数据">↻ 刷新数据</button>
          </div>
          <div id="snippets" class="snippets"></div>
          <p id="empty" class="empty">还没有内容，先保存第一条吧。</p>
        </section>
      </section>
    </main>
    <script type="module" src="/client.mjs"></script>
  </body>
</html>
