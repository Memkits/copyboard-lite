<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eccf32" />
    <title>Copyboard Lite</title>
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body>
    <main id="app">
      <section class="shell">
        <header>
          <div>
            <p class="eyebrow">UNIONID PLAYGROUND</p>
            <h1>Copyboard <span>Lite</span></h1>
          </div>
          <span id="status" class="status">连接中</span>
        </header>
        <section id="login-panel" class="login-panel">
          <h2>登录你的剪贴板</h2>
          <p>账号由服务端配置，每个用户只能访问自己的内容。</p>
          <form id="login-form">
            <input id="username" autocomplete="username" placeholder="用户名" required />
            <input id="password" type="password" autocomplete="current-password" placeholder="密码" required />
            <button type="submit">登录</button>
          </form>
        </section>
        <section id="board" hidden>
          <div class="user-bar">
            <span>当前用户：<strong id="current-user"></strong></span>
            <button id="logout" class="ghost" type="button">退出</button>
          </div>
          <form id="snippet-form">
            <textarea id="content" rows="4" placeholder="粘贴一段文字或链接…" required></textarea>
            <div class="composer-actions">
              <span>Ctrl / ⌘ + Enter 快速发送</span>
              <button type="submit">保存到剪贴板</button>
            </div>
          </form>
          <div class="section-title">
            <h2>最近内容</h2>
            <button id="refresh" class="ghost" type="button">刷新</button>
          </div>
          <div id="snippets" class="snippets"></div>
          <p id="empty" class="empty">还没有内容，先保存第一条吧。</p>
        </section>
      </section>
    </main>
    <script type="module" src="/client.mjs"></script>
  </body>
</html>
