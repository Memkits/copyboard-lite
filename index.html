<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eccf32" />
    <title>Copyboard Lite</title>
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body>
    <main id="app">
      <section class="shell">
        <header>
          <div>
            <p class="eyebrow">UNIONID PLAYGROUND</p>
            <h1>Copyboard <span>Lite</span></h1>
          </div>
          <span id="status" class="status">连接中</span>
        </header>
        <form id="snippet-form">
          <textarea id="content" rows="4" placeholder="粘贴一段文字或链接…" required></textarea>
          <button type="submit">保存到剪贴板</button>
        </form>
        <div class="section-title">
          <h2>最近内容</h2>
          <button id="refresh" class="ghost" type="button">刷新</button>
        </div>
        <div id="snippets" class="snippets"></div>
        <p id="empty" class="empty">还没有内容，先保存第一条吧。</p>
      </section>
    </main>
    <script type="module" src="/client.mjs"></script>
  </body>
</html>
